<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER TRADER V70</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        /* CYBERPUNK THEME */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --bg: #050505;
            --card-bg: rgba(20, 20, 25, 0.8);
            --neon-green: #00ff41;
            --neon-pink: #f700ff;
            --neon-blue: #00f3ff;
            --text: #e0e0e0;
            --border: 1px solid rgba(0, 243, 255, 0.2);
            --glow: 0 0 10px rgba(0, 243, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            background-image: linear-gradient(0deg, transparent 24%, rgba(0, 255, 65, .03) 25%, rgba(0, 255, 65, .03) 26%, transparent 27%, transparent 74%, rgba(0, 255, 65, .03) 75%, rgba(0, 255, 65, .03) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 255, 65, .03) 25%, rgba(0, 255, 65, .03) 26%, transparent 27%, transparent 74%, rgba(0, 255, 65, .03) 75%, rgba(0, 255, 65, .03) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            margin: 0; padding-bottom: 90px;
        }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }
        .title { font-size: 20px; color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); }
        .status { font-size: 10px; color: var(--neon-green); }

        /* TERMINAL (LIVE LOG) */
        .terminal {
            background: #000;
            border: 1px solid var(--neon-green);
            padding: 10px;
            margin: 15px;
            height: 120px;
            overflow-y: auto;
            font-size: 10px;
            color: var(--neon-green);
            box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.1);
            border-radius: 4px;
        }
        .log-line { margin-bottom: 4px; }
        .log-time { opacity: 0.6; margin-right: 5px; }

        /* CARDS */
        .card {
            background: var(--card-bg);
            border: var(--border);
            margin: 15px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: var(--glow);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 100%;
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }
        .card-header {
            display: flex; justify-content: space-between;
            font-size: 12px; color: var(--neon-blue); margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* INPUTS */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; font-size: 10px; color: var(--neon-blue); margin-bottom: 5px; }
        input[type="number"], input[type="text"] {
            width: 100%; box-sizing: border-box;
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            color: var(--neon-green);
            padding: 10px;
            font-family: 'Share Tech Mono', monospace;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }

        /* BUTTONS */
        .btn {
            width: 100%; padding: 15px; margin-top: 10px;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold; cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-start { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.1); }
        .btn-stop { border-color: var(--neon-pink); color: var(--neon-pink); }
        .btn-save { background: rgba(0, 243, 255, 0.1); }

        /* ACTIVE TRADES (Holographic Cards) */
        .trade-card {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; padding: 10px 0;
        }
        .pnl-pos { color: var(--neon-green); }
        .pnl-neg { color: var(--neon-pink); }

        /* NAV */
        .navbar {
            position: fixed; bottom: 0; width: 100%;
            background: #000; border-top: 1px solid var(--neon-blue);
            display: flex; justify-content: space-around; padding: 15px 0;
            z-index: 99;
        }
        .nav-item { color: #555; font-size: 20px; transition: 0.3s; }
        .nav-item.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); transform: scale(1.2); }

        .page { display: none; }
        .page.active { display: block; animation: glitch 0.3s; }
        @keyframes glitch { 0% { opacity: 0; transform: translateX(-10px); } 100% { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="title">CYBER TRADER v70</div>
            <div class="status">SYSTEM ONLINE</div>
        </div>
        <div style="font-size: 20px;">🧬</div>
    </div>

    <div id="page-home" class="page active">
        <div class="terminal" id="terminal">
            <div class="log-line"><span class="log-time">[SYSTEM]</span> Connecting to Neural Network...</div>
            <div class="log-line"><span class="log-time">[SYSTEM]</span> Uzbekistan Time Sync: OK</div>
            <div class="log-line"><span class="log-time">[DB]</span> SQLite Core Loaded.</div>
        </div>

        <div class="card">
            <div class="card-header"><span>Active Positions</span> <span>LIVE</span></div>
            <div id="active-trades-list">
                <div style="text-align: center; color: #555; padding: 20px;">NO SIGNAL</div>
            </div>
        </div>
    </div>

    <div id="page-settings" class="page">
        <input type="hidden" id="bot_id" value="MAIN">
        
        <div class="card">
            <div class="card-header"><span>Target Lock</span></div>
            <label>ASSET PAIR</label>
            <input type="text" id="symbol" value="BTC/USDT">
            
            <div class="grid" style="margin-top:10px;">
                <div><label>AMOUNT ($)</label><input type="number" id="amount" value="10"></div>
                <div><label>DCA (x)</label><input type="number" id="dca_mult" value="1.5"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><span>Neural Filters</span></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <label>EMA 200 (Trend)</label><input type="checkbox" id="use_ema" checked>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <label>ATR (Volatility)</label><input type="checkbox" id="use_atr" checked>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><span>Execution</span></div>
            <div class="grid">
                <div><label>DROP %</label><input type="number" id="drop" value="0.35"></div>
                <div><label>PROFIT %</label><input type="number" id="tp" value="0.5"></div>
            </div>
            <div style="margin-top:10px;">
                <label>RSI LIMIT (5m)</label>
                <input type="number" id="rsi_limit" value="30">
            </div>
        </div>

        <div style="padding: 15px;">
            <button class="btn btn-save" onclick="send('save')">SAVE CONFIG</button>
            <button class="btn btn-start" onclick="send('start')">INITIALIZE</button>
            <button class="btn btn-stop" onclick="send('stop')">TERMINATE</button>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="nav('home')">▤</div>
        <div class="nav-item" onclick="nav('settings')">⚙</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();

        // FAKE TERMINAL LOGIC (VISUAL ONLY)
        function log(msg) {
            const t = document.getElementById('terminal');
            const time = new Date().toLocaleTimeString();
            t.innerHTML += `<div class="log-line"><span class="log-time">[${time}]</span> ${msg}</div>`;
            t.scrollTop = t.scrollHeight;
        }

        // LOAD SAVED DATA
        let config = JSON.parse(localStorage.getItem('v70_config')) || {};
        if(config.symbol) {
            document.getElementById('symbol').value = config.symbol;
            document.getElementById('amount').value = config.amount;
            document.getElementById('tp').value = config.tp;
        }

        function nav(p) {
            document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function send(action) {
            const data = {
                action: action,
                bot_id: 'MAIN',
                symbol: document.getElementById('symbol').value.toUpperCase(),
                amount: parseFloat(document.getElementById('amount').value),
                dca_mult: parseFloat(document.getElementById('dca_mult').value),
                tp: parseFloat(document.getElementById('tp').value),
                drop: parseFloat(document.getElementById('drop').value),
                rsi_limit: parseFloat(document.getElementById('rsi_limit').value),
                use_ema: document.getElementById('use_ema').checked,
                use_atr: document.getElementById('use_atr').checked
            };
            
            localStorage.setItem('v70_config', JSON.stringify(data));
            
            if(action === 'start') log(`INITIATING SEQUENCE FOR ${data.symbol}...`);
            if(action === 'stop') log(`TERMINATING PROCESS...`);
            
            tg.sendData(JSON.stringify(data));
        }

        // SIMULATE LOGS
        setInterval(() => {
            if(Math.random() > 0.7) {
                const msgs = ["Scanning Market...", "EMA Trend: Bullish", "RSI: 45 (Neutral)", "Waiting for entry..."];
                log(msgs[Math.floor(Math.random()*msgs.length)]);
            }
        }, 5000);

    </script>
</body>
</html>
