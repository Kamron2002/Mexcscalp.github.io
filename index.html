<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Onyx V80</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        :root {
            --bg: #0b0e11; 
            --card: #151a21;
            --gold: #D4AF37;
            --green: #27ae60;
            --red: #e74c3c;
            --text: #ffffff;
            --text-sub: #8b9bb4;
            --border: 1px solid rgba(255,255,255,0.05);
        }

        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 15px; padding-bottom: 100px;
            font-size: 13px;
        }

        /* HEADER & LANG */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .brand { font-size: 18px; font-weight: 600; color: var(--gold); letter-spacing: 1px; display: flex; align-items: center; gap: 8px;}
        .lang-select {
            background: var(--card); color: var(--text);
            border: var(--border); padding: 5px; border-radius: 6px;
            font-size: 11px; outline: none;
        }
        .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }

        /* BIG BALANCE CARD */
        .balance-card {
            background: linear-gradient(145deg, #1e232b, #151a21);
            border-radius: 12px; padding: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .balance-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, transparent 70%);
        }
        .bal-title { color: var(--text-sub); font-size: 11px; text-transform: uppercase; margin-bottom: 5px; }
        .bal-value { font-size: 32px; font-weight: 600; color: #fff; }
        .refresh-icon { position: absolute; top: 15px; right: 15px; font-size: 16px; cursor: pointer; opacity: 0.7; }

        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { 
            flex: 1; text-align: center; padding: 10px; 
            background: var(--card); border-radius: 8px; 
            color: var(--text-sub); cursor: pointer; transition: 0.3s;
            border: var(--border); font-size: 11px;
        }
        .tab.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); border-color: var(--gold); }

        /* CONTENT AREAS */
        .content-area { display: none; animation: fade 0.3s; }
        .content-area.active { display: block; }
        @keyframes fade { from{opacity:0} to{opacity:1} }

        /* WALLET LIST */
        .wallet-item { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 8px; border: var(--border); }
        .coin-info { display: flex; align-items: center; gap: 10px; }
        .coin-img { width: 24px; height: 24px; border-radius: 50%; background: #333; }
        .coin-name { font-weight: 600; }
        .coin-amt { font-family: monospace; color: var(--gold); }

        /* HISTORY LIST */
        .hist-item { display: flex; justify-content: space-between; padding: 12px; background: var(--card); margin-bottom: 8px; border-radius: 8px; border: var(--border); font-size: 11px; }
        .h-buy { color: var(--green); } .h-sell { color: var(--gold); }

        /* STRATEGY CARDS */
        .bot-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; border: var(--border); transition: 0.3s; position: relative; }
        .bot-card.running { border-left: 3px solid var(--green); }
        .bot-card.paused { border-left: 3px solid #555; }
        .bot-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .inp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .inp-group input { width: 100%; background: #0b0e11; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; box-sizing: border-box; }
        .bot-controls { display: flex; gap: 8px; margin-top: 10px; }
        .btn { flex: 1; padding: 8px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 11px; }
        .btn-run { background: rgba(39, 174, 96, 0.2); color: var(--green); border: 1px solid var(--green); }
        .btn-stop { background: rgba(255, 255, 255, 0.1); color: #ccc; }

        /* FOOTER ACTIONS */
        .main-actions { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(11, 14, 17, 0.95); padding: 15px; box-sizing: border-box; display: flex; gap: 10px; backdrop-filter: blur(10px); border-top: var(--border); }
        .action-btn { flex: 1; padding: 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px; text-transform: uppercase; }
        .save-local { background: #1e232b; color: #fff; border: 1px solid #333; }
        .deploy { background: var(--gold); color: #000; }

    </style>
</head>
<body>

    <div class="header">
        <div class="brand"><span class="live-dot"></span> ONYX V80</div>
        <select class="lang-select" id="lang" onchange="changeLang()">
            <option value="en">🇺🇸 EN</option>
            <option value="ru">🇷🇺 RU</option>
            <option value="uz">🇺🇿 UZ</option>
        </select>
    </div>

    <div class="balance-card">
        <div class="refresh-icon" onclick="requestRefresh()">↻</div>
        <div class="bal-title" id="t_bal">Total Balance (USDT)</div>
        <div class="bal-value">$ <span id="main_bal">...</span></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="tab('bots')" id="t_bots">Strategies</div>
        <div class="tab" onclick="tab('wallet')" id="t_wallet">Wallet</div>
        <div class="tab" onclick="tab('history')" id="t_hist">History</div>
    </div>

    <div id="view-bots" class="content-area active">
        <div id="bots_list"></div>
        <div style="text-align: center; margin-top: 15px; color: var(--gold); cursor: pointer;" onclick="addBot()">+ <span id="t_add">ADD</span></div>
    </div>

    <div id="view-wallet" class="content-area">
        <div id="wallet_list"></div>
    </div>

    <div id="view-history" class="content-area">
        <div id="hist_list"></div>
    </div>

    <div style="height: 80px;"></div>

    <div class="main-actions">
        <button class="action-btn save-local" onclick="saveLocal()" id="t_save">💾 Save Draft</button>
        <button class="action-btn deploy" onclick="deploy()" id="t_deploy">🚀 Deploy</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();

        // 1. DATA PARSING
        const urlParams = new URLSearchParams(window.location.search);
        
        // Balance
        const balParam = urlParams.get('bal');
        if(balParam) { document.getElementById('main_bal').innerText = balParam; localStorage.setItem('cached_main_bal', balParam); }
        else { document.getElementById('main_bal').innerText = localStorage.getItem('cached_main_bal') || '0.00'; }

        // Wallet
        const rawW = urlParams.get('w') || "";
        const walletData = rawW.split(',').filter(x=>x).map(x => { const p = x.split(':'); return { sym: p[0], amt: p[1] }; });

        // History
        const rawH = urlParams.get('h') || "";
        const histData = rawH.split('|').filter(x=>x).map(x => { const p = x.split(','); return { sym: p[0], type: p[1], prof: p[2] }; });

        // 2. RENDER WALLET
        const wList = document.getElementById('wallet_list');
        if(walletData.length === 0) wList.innerHTML = '<div style="text-align:center;color:#555;padding:20px">Empty</div>';
        else {
            wList.innerHTML = walletData.map(c => {
                const icon = `https://cryptologos.cc/logos/${c.sym.toLowerCase().replace('usdt','tether')}-${c.sym.toLowerCase().replace('usdt','usdt')}-logo.png?v=025`;
                return `<div class="wallet-item">
                    <div class="coin-info"><img src="${icon}" class="coin-img" onerror="this.src='https://via.placeholder.com/24'"><span class="coin-name">${c.sym}</span></div>
                    <div class="coin-amt">${c.amt}</div>
                </div>`;
            }).join('');
        }

        // 3. RENDER HISTORY
        const hList = document.getElementById('hist_list');
        if(histData.length === 0) hList.innerHTML = '<div style="text-align:center;color:#555;padding:20px">No trades</div>';
        else {
            hList.innerHTML = histData.map(h => {
                return `<div class="hist-item">
                    <div><b>${h.sym}</b></div>
                    <div class="${h.type.includes('BUY')?'h-buy':'h-sell'}">${h.type}</div>
                    <div style="color:#fff">${h.prof>0?'+':''}${h.prof}$</div>
                </div>`;
            }).join('');
        }

        // 4. BOTS LOGIC
        let bots = JSON.parse(localStorage.getItem('onyx_bots_v80')) || [];
        
        function renderBots() {
            const list = document.getElementById('bots_list'); list.innerHTML = '';
            bots.forEach((b, i) => {
                list.innerHTML += `
                <div class="bot-card ${b.status?'running':'paused'}">
                    <div class="bot-top">
                        <div style="font-weight:600">${b.symbol}</div>
                        <div style="font-size:10px; color:${b.status?'var(--green)':'#555'}">${b.status?'ACTIVE':'IDLE'}</div>
                    </div>
                    <div class="inp-grid">
                        <div class="inp-group"><input type="text" value="${b.symbol}" onchange="upd(${i},'symbol',this.value)"></div>
                        <div class="inp-group"><input type="number" value="${b.amount}" onchange="upd(${i},'amount',this.value)" placeholder="$"></div>
                        <div class="inp-group"><input type="number" value="${b.drop}" onchange="upd(${i},'drop',this.value)" placeholder="Drop%"></div>
                    </div>
                    <div class="bot-controls">
                        <button class="btn btn-run" onclick="tog(${i},true)">START</button>
                        <button class="btn btn-stop" onclick="tog(${i},false)">PAUSE</button>
                        <button class="btn" style="background:#222;color:#555;flex:0 0 30px" onclick="del(${i})">x</button>
                    </div>
                </div>`;
            });
            applyLang();
        }

        function upd(i,k,v){ bots[i][k]=(k==='symbol')?v.toUpperCase():parseFloat(v); saveLocal(); }
        function tog(i,s){ bots[i].status=s; saveLocal(); renderBots(); }
        function addBot(){ bots.push({id:'B'+Date.now(), symbol:'BTC/USDT', amount:10, drop:0.5, tp:0.5, status:false}); saveLocal(); renderBots(); }
        function del(i){ if(confirm('Delete?')){bots.splice(i,1); saveLocal(); renderBots();} }
        function saveLocal(){ localStorage.setItem('onyx_bots_v80', JSON.stringify(bots)); }
        function deploy(){ saveLocal(); tg.sendData(JSON.stringify({type:"SYNC", bots:bots})); }
        function requestRefresh(){ tg.sendData(JSON.stringify({type:"REFRESH"})); }

        // 5. LANGUAGE
        const txt = {
            en: { bal: "Total Balance", bots: "Strategies", wallet: "Wallet", hist: "History", add: "ADD NEW", save: "Save Draft", deploy: "Deploy" },
            ru: { bal: "Общий Баланс", bots: "Стратегии", wallet: "Кошелек", hist: "История", add: "ДОБАВИТЬ", save: "Сохранить", deploy: "Запустить" },
            uz: { bal: "Umumiy Balans", bots: "Strategiyalar", wallet: "Hamyon", hist: "Tarix", add: "QO'SHISH", save: "Saqlash", deploy: "Ishga tushirish" }
        };
        
        let curLang = localStorage.getItem('lang') || 'en';
        document.getElementById('lang').value = curLang;
        
        function changeLang(){ curLang = document.getElementById('lang').value; localStorage.setItem('lang', curLang); applyLang(); }
        
        function applyLang(){
            const t = txt[curLang];
            document.getElementById('t_bal').innerText = t.bal;
            document.getElementById('t_bots').innerText = t.bots;
            document.getElementById('t_wallet').innerText = t.wallet;
            document.getElementById('t_hist').innerText = t.hist;
            document.getElementById('t_add').innerText = t.add;
            document.getElementById('t_save').innerText = t.save;
            document.getElementById('t_deploy').innerText = t.deploy;
        }

        function tab(t) {
            document.querySelectorAll('.content-area').forEach(e=>e.classList.remove('active'));
            document.getElementById('view-'+t).classList.add('active');
            document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
            document.getElementById('t_'+t).classList.add('active');
        }

        if(bots.length===0) addBot();
        renderBots();
    </script>
</body>
</html>
