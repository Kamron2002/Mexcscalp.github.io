<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Onyx AI V79</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        :root { --bg: #0b0e11; --card: #151a21; --gold: #D4AF37; --green: #27ae60; --red: #e74c3c; --text: #fff; --sub: #8b9bb4; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 15px; padding-bottom: 90px; font-size: 13px; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand { font-size: 16px; font-weight: 600; color: var(--gold); display: flex; align-items: center; gap: 8px; }
        .ai-pulse { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% {opacity:1} 50% {opacity:0.4} 100% {opacity:1} }

        /* TABS */
        .tabs { display: flex; background: var(--card); padding: 4px; border-radius: 8px; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 8px; border-radius: 6px; color: var(--sub); cursor: pointer; font-size: 11px; }
        .tab.active { background: #2c3e50; color: #fff; font-weight: 600; }

        /* WALLET */
        .wallet-item { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .coin-info { display: flex; align-items: center; gap: 10px; }
        .coin-img { width: 24px; height: 24px; border-radius: 50%; background: #333; }
        .coin-name { font-weight: 600; }
        .coin-amt { font-family: monospace; color: var(--gold); }

        /* STRATEGIES */
        .bot-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; border-left: 3px solid #555; transition: 0.3s; }
        .bot-card.active { border-left-color: var(--green); }
        .bot-head { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
        .inp-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input { width: 100%; background: #0b0e11; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 4px; box-sizing: border-box; }
        
        /* HISTORY */
        .hist-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #222; font-size: 11px; }
        .hist-type.BUY { color: var(--green); }
        .hist-type.SELL { color: var(--gold); }
        .hist-type.STOP { color: var(--red); }

        /* CONTROLS */
        .controls { display: flex; gap: 5px; margin-top: 10px; }
        .btn { flex: 1; padding: 8px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; font-size: 10px; }
        .btn-run { background: rgba(39, 174, 96, 0.2); color: var(--green); border: 1px solid var(--green); }
        .btn-stop { background: rgba(255, 255, 255, 0.1); color: #ccc; }
        
        .main-btn { position: fixed; bottom: 20px; left: 15px; right: 15px; background: var(--gold); color: #000; padding: 14px; border-radius: 8px; text-align: center; font-weight: bold; text-transform: uppercase; cursor: pointer; box-shadow: 0 5px 20px rgba(212,175,55,0.3); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand"><div class="ai-pulse"></div> ONYX AI SYSTEM</div>
        <div style="font-size: 10px; color: var(--sub);">V79</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="tab('wallet')">WALLET</div>
        <div class="tab" onclick="tab('bots')">BOTS</div>
        <div class="tab" onclick="tab('history')">HISTORY</div>
    </div>

    <div id="view-wallet">
        <div id="wallet-list"></div>
    </div>

    <div id="view-bots" class="hidden">
        <div id="bots-list"></div>
        <div style="text-align: center; margin: 15px; color: var(--sub); font-size: 10px; cursor: pointer;" onclick="addBot()">+ ADD STRATEGY</div>
    </div>

    <div id="view-history" class="hidden">
        <div style="background: var(--card); border-radius: 8px; padding: 10px;">
            <div id="history-list"></div>
        </div>
        <div style="margin-top: 20px; padding: 15px; background: rgba(39, 174, 96, 0.1); border-radius: 8px; text-align: center;">
            <div style="font-weight: bold; color: var(--green);">🧠 AI SCANNER ACTIVE</div>
            <div style="font-size: 10px; color: var(--sub); margin-top: 5px;">Scanning BTC/ETH for entry points...</div>
        </div>
    </div>

    <div class="main-btn" onclick="sync()">✅ ACTIVATE SYSTEM</div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();

        // 1. PARSE DATA FROM URL
        const urlParams = new URLSearchParams(window.location.search);
        
        // Wallet Data: "BTC:0.5,USDT:100"
        const rawWallet = urlParams.get('w') || "";
        const walletData = rawWallet.split(',').filter(x=>x).map(x => {
            const p = x.split(':'); return { sym: p[0], amt: p[1] };
        });

        // History Data: "BTC,BUY,0|ETH,SELL,1.2"
        const rawHist = urlParams.get('h') || "";
        const histData = rawHist.split('|').filter(x=>x).map(x => {
            const p = x.split(','); return { sym: p[0], type: p[1], prof: p[2] };
        });

        // 2. RENDER WALLET
        const wList = document.getElementById('wallet-list');
        if(walletData.length === 0) wList.innerHTML = '<div style="text-align:center; color:#555">Empty Wallet</div>';
        else {
            walletData.forEach(c => {
                // Try to get icon from CDN
                const icon = `https://cryptologos.cc/logos/${c.sym.toLowerCase().replace('usdt','tether')}-${c.sym.toLowerCase().replace('usdt','usdt')}-logo.png?v=025`;
                wList.innerHTML += `
                <div class="wallet-item">
                    <div class="coin-info">
                        <img src="${icon}" class="coin-img" onerror="this.src='https://via.placeholder.com/24'">
                        <div class="coin-name">${c.sym}</div>
                    </div>
                    <div class="coin-amt">${c.amt}</div>
                </div>`;
            });
        }

        // 3. RENDER HISTORY
        const hList = document.getElementById('history-list');
        if(histData.length === 0) hList.innerHTML = '<div style="text-align:center; color:#555">No recent trades</div>';
        else {
            histData.forEach(h => {
                let color = '#fff';
                if(h.type.includes('BUY')) color = 'var(--green)';
                if(h.type.includes('SELL')) color = 'var(--gold)';
                if(h.type.includes('STOP')) color = 'var(--red)';
                
                hList.innerHTML += `
                <div class="hist-item">
                    <div><b>${h.sym}</b></div>
                    <div style="color:${color}">${h.type}</div>
                    <div>${h.prof > 0 ? '+'+h.prof : h.prof} $</div>
                </div>`;
            });
        }

        // 4. BOTS LOGIC
        let bots = JSON.parse(localStorage.getItem('onyx_bots_v79')) || [];
        
        function renderBots() {
            const list = document.getElementById('bots-list'); list.innerHTML = '';
            bots.forEach((b, i) => {
                list.innerHTML += `
                <div class="bot-card ${b.status?'active':''}">
                    <div class="bot-head">
                        <span>#${i+1} ${b.symbol}</span>
                        <span style="font-size:10px; color:${b.status?'var(--green)':'#555'}">${b.status?'RUNNING':'STOPPED'}</span>
                    </div>
                    <div class="inp-row">
                        <input type="text" value="${b.symbol}" onchange="upd(${i},'symbol',this.value)">
                        <input type="number" value="${b.amount}" onchange="upd(${i},'amount',this.value)" placeholder="USD">
                    </div>
                    <div class="controls">
                        <button class="btn btn-run" onclick="tog(${i},true)">START</button>
                        <button class="btn btn-stop" onclick="tog(${i},false)">STOP</button>
                        <button class="btn" style="background:#222;color:#888;flex:0 0 30px" onclick="del(${i})">x</button>
                    </div>
                </div>`;
            });
        }

        function upd(i, k, v) { bots[i][k] = (k==='symbol')?v.toUpperCase():parseFloat(v); save(); }
        function tog(i, s) { bots[i].status = s; renderBots(); save(); }
        function addBot() { bots.push({id:'B'+Date.now(), symbol:'BTC/USDT', amount:10, drop:0.5, tp:0.5, status:false}); renderBots(); save(); }
        function del(i) { bots.splice(i,1); renderBots(); save(); }
        function save() { localStorage.setItem('onyx_bots_v79', JSON.stringify(bots)); }
        
        function tab(t) {
            ['wallet','bots','history'].forEach(x => document.getElementById('view-'+x).classList.add('hidden'));
            document.getElementById('view-'+t).classList.remove('hidden');
            document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
            event.target.classList.add('active');
        }

        function sync() {
            save();
            tg.sendData(JSON.stringify({type:"SYNC", bots:bots}));
        }

        if(bots.length===0) addBot();
        renderBots();

    </script>
</body>
</html>
