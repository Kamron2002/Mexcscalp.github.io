<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Trader V74</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --glass: rgba(255,255,255,0.08); --primary: #2962ff; --text: #fff; --text-sec: #8b9bb4; --success: #00c853; }
        body { background: radial-gradient(circle at top, #111 0%, #000 100%); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 80px; }
        
        /* HEADER */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .lang-select { background: #333; color: white; border: none; padding: 5px 10px; border-radius: 15px; font-size: 12px; outline: none; }
        
        /* TABS */
        .page { display: none; padding: 15px; animation: fade 0.3s; }
        .page.active { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* CARDS */
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .balance-title { font-size: 12px; color: var(--text-sec); text-transform: uppercase; }
        .balance-val { font-size: 32px; font-weight: 700; margin: 5px 0; }
        
        .refresh-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        
        /* LOGS TAB */
        .log-container { background: #0a0a0a; border: 1px solid #333; border-radius: 10px; height: 400px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 11px; }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .log-time { color: var(--primary); margin-right: 5px; }
        .log-buy { color: var(--success); }
        .log-sell { color: #ff1744; }

        /* BOT ITEM */
        .bot-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .status-badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; background: rgba(0,200,83,0.2); color: var(--success); }

        /* NAVBAR */
        .navbar { position: fixed; bottom: 0; width: 100%; background: #050505; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 12px 0; z-index: 99; }
        .nav-item { color: #555; text-align: center; font-size: 10px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 3px; }

        /* MODAL */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:200; display:none; padding:20px; box-sizing:border-box; }
        input { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .btn-save { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight:bold;">Global Trader V74</div>
        <select class="lang-select" onchange="changeLang(this.value)">
            <option value="ru">🇷🇺 RU</option>
            <option value="uz">🇺🇿 UZ</option>
            <option value="en">🇺🇸 EN</option>
        </select>
    </div>

    <div id="page-dash" class="page active">
        <div class="card">
            <div class="balance-title" id="t-balance">Общий Баланс (USDT)</div>
            <div class="balance-val">$ <span id="real-balance">---</span></div>
            <button class="refresh-btn" onclick="requestBalance()">
                🔄 <span id="t-refresh">Обновить с Биржи</span>
            </button>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span id="t-active-bots">Активные Боты</span>
                <span onclick="addBot()" style="color:var(--primary); cursor:pointer;">+ ADD</span>
            </div>
            <div id="bot-list"></div>
        </div>
    </div>

    <div id="page-logs" class="page">
        <div class="card">
            <div style="margin-bottom:10px;" id="t-live-log">Живой Журнал Операций</div>
            <div class="log-container" id="log-box">
                <div class="log-entry"><span class="log-time">System:</span> Waiting for connection...</div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <h3 id="t-settings">Настройки Стратегии</h3>
        <input type="hidden" id="edit-id">
        <label>Pair</label><input type="text" id="edit-symbol">
        <label>Budget ($)</label><input type="number" id="edit-budget">
        <label>Amount ($)</label><input type="number" id="edit-amount">
        <label>Take Profit (%)</label><input type="number" id="edit-tp">
        <button class="btn-save" onclick="saveBot()" id="t-save">СОХРАНИТЬ</button>
        <button style="width:100%; padding:15px; background:transparent; border:1px solid #ff1744; color:#ff1744; border-radius:8px; margin-top:10px;" onclick="closeModal()">CANCEL</button>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="nav('dash')">
            <span class="nav-icon">📊</span><span id="n-dash">Дашборд</span>
        </div>
        <div class="nav-item" onclick="nav('logs')">
            <span class="nav-icon">📜</span><span id="n-logs">Логи</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        let bots = JSON.parse(localStorage.getItem('v74_bots')) || [];

        // --- TRANSLATIONS (Словарь) ---
        const langData = {
            ru: {
                balance: "Общий Баланс (USDT)", refresh: "Обновить с Биржи", active: "Активные Боты",
                live: "Живой Журнал", settings: "Настройки", save: "СОХРАНИТЬ",
                n_dash: "Дашборд", n_logs: "Логи"
            },
            uz: {
                balance: "Umumiy Balans (USDT)", refresh: "Birjadan yangilash", active: "Faol Botlar",
                live: "Jonli Loglar", settings: "Sozlamalar", save: "SAQLASH",
                n_dash: "Boshqaruv", n_logs: "Loglar"
            },
            en: {
                balance: "Total Balance (USDT)", refresh: "Sync from Exchange", active: "Active Bots",
                live: "Live Logs", settings: "Settings", save: "SAVE",
                n_dash: "Dashboard", n_logs: "Logs"
            }
        };

        function changeLang(lang) {
            const t = langData[lang];
            document.getElementById('t-balance').innerText = t.balance;
            document.getElementById('t-refresh').innerText = t.refresh;
            document.getElementById('t-active-bots').innerText = t.active;
            document.getElementById('t-live-log').innerText = t.live;
            document.getElementById('t-settings').innerText = t.settings;
            document.getElementById('t-save').innerText = t.save;
            document.getElementById('n-dash').innerText = t.n_dash;
            document.getElementById('n-logs').innerText = t.n_logs;
        }

        // --- REAL BALANCE LOGIC ---
        function requestBalance() {
            // Отправляем боту команду запросить баланс
            tg.sendData(JSON.stringify({ type: "GET_BALANCE" }));
            // Визуально показываем загрузку
            document.getElementById('real-balance').innerText = "Loading...";
        }

        // --- NAVIGATION ---
        function nav(p) {
            document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
            if(p==='dash') document.querySelectorAll('.nav-item')[0].classList.add('active');
            if(p==='logs') document.querySelectorAll('.nav-item')[1].classList.add('active');
        }

        // --- BOTS & LOGS ---
        function renderBots() {
            const list = document.getElementById('bot-list'); list.innerHTML='';
            bots.forEach(b => {
                const el = document.createElement('div'); el.className='bot-item';
                el.innerHTML = `<div><b>${b.symbol}</b><br><span style="font-size:10px; color:#888">$${b.amount} | Budget: $${b.budget}</span></div>
                                <div class="status-badge">${b.status?'ON':'OFF'}</div>`;
                el.onclick = () => openModal(b.id);
                list.appendChild(el);
            });
        }
        
        function addBot() {
            const id='B_'+Date.now();
            bots.push({id:id, symbol:'BTC/USDT', status:true, budget:100, amount:10, tp:0.5});
            renderBots(); openModal(id);
        }

        function openModal(id) {
            const b = bots.find(x=>x.id===id);
            document.getElementById('edit-id').value=id;
            document.getElementById('edit-symbol').value=b.symbol;
            document.getElementById('edit-budget').value=b.budget;
            document.getElementById('edit-amount').value=b.amount;
            document.getElementById('edit-tp').value=b.tp;
            document.getElementById('modal').style.display='block';
        }

        function saveBot() {
            const id = document.getElementById('edit-id').value;
            const idx = bots.findIndex(x=>x.id===id);
            if(idx>-1) {
                bots[idx].symbol = document.getElementById('edit-symbol').value.toUpperCase();
                bots[idx].budget = parseFloat(document.getElementById('edit-budget').value);
                bots[idx].amount = parseFloat(document.getElementById('edit-amount').value);
                bots[idx].tp = parseFloat(document.getElementById('edit-tp').value);
                localStorage.setItem('v74_bots', JSON.stringify(bots));
                // Отправляем данные боту (Синхронизация)
                tg.sendData(JSON.stringify({ type: "SYNC", bots: bots }));
            }
            document.getElementById('modal').style.display='none';
            renderBots();
        }
        function closeModal() { document.getElementById('modal').style.display='none'; }

        // MOCK LOGS (Бот не может пушить логи в HTML без сервера, но мы покажем заглушку)
        // В реальном приложении логи читались бы через fetch API, но здесь мы используем Telegram WebApp
        // Мы можем сохранять логи в localStorage при получении команд
        renderBots();
    </script>
</body>
</html>
