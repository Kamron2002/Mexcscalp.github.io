<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Safety V82</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body { background: #0b0e11; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; padding-bottom: 90px; font-size: 13px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .status-badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .bg-green { background: rgba(39, 174, 96, 0.2); color: #27ae60; border: 1px solid #27ae60; }
        .bg-orange { background: rgba(230, 126, 34, 0.2); color: #e67e22; border: 1px solid #e67e22; }
        .bg-red { background: rgba(192, 57, 43, 0.2); color: #c0392b; border: 1px solid #c0392b; }

        .card { background: #151a21; border-radius: 12px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; }
        .bal-val { font-size: 28px; font-weight: 600; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; text-align: center; padding: 8px; background: #1e232b; border-radius: 6px; color: #888; cursor: pointer; }
        .tab.active { background: #d4af37; color: #000; font-weight: bold; }

        .content { display: none; }
        .content.active { display: block; }

        .bot-item { background: #1e232b; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid #555; }
        .bot-item.on { border-left-color: #27ae60; }
        .inp-row { display: flex; gap: 5px; margin-top: 5px; }
        input { width: 100%; background: #0b0e11; border: 1px solid #333; color: #fff; padding: 6px; border-radius: 4px; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(11,14,17,0.95); padding: 15px; display: flex; gap: 10px; box-sizing: border-box; }
        .btn { flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-save { background: #333; color: #fff; }
        .btn-run { background: #d4af37; color: #000; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; font-size: 16px;">V82 SAFETY CORE</div>
        <div id="sys_status" class="status-badge bg-green">SYSTEM NORMAL</div>
    </div>

    <div class="card">
        <div style="font-size: 11px; color: #888;">TOTAL EQUITY</div>
        <div class="bal-val">$ <span id="main_bal">...</span></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="tab('bots')">STRATEGIES</div>
        <div class="tab" onclick="tab('wallet')">WALLET</div>
    </div>

    <div id="view-bots" class="content active">
        <div id="bots_list"></div>
        <div style="text-align:center; padding:10px; color:#d4af37; cursor:pointer" onclick="addBot()">+ ADD NEW</div>
    </div>

    <div id="view-wallet" class="content">
        <div id="wallet_list"></div>
    </div>

    <div class="footer">
        <button class="btn btn-save" onclick="save()">Save</button>
        <button class="btn btn-run" onclick="deploy()">Deploy</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const urlP = new URLSearchParams(window.location.search);
        
        // 1. STATUS PARSING
        const status = urlP.get('s') || "GREEN";
        const badge = document.getElementById('sys_status');
        if(status === "RED") { badge.className = "status-badge bg-red"; badge.innerText = "HALTED: LOSS LIMIT"; }
        if(status === "ORANGE") { badge.className = "status-badge bg-orange"; badge.innerText = "PAUSED: CRASH"; }
        
        // 2. DATA
        const bal = urlP.get('b'); if(bal) document.getElementById('main_bal').innerText = bal;
        const wallet = (urlP.get('w')||"").split(',').filter(x=>x).map(x=>{const p=x.split(':'); return {s:p[0], a:p[1], v:p[2]}});
        
        const wl = document.getElementById('wallet_list');
        wl.innerHTML = wallet.map(c=>`
            <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333">
                <div><b>${c.s}</b> <span style="font-size:10px;color:#888">${c.a}</span></div>
                <div style="color:#27ae60">$${c.v}</div>
            </div>`).join('') || '<div style="text-align:center;color:#555">Empty</div>';

        // 3. BOTS
        let bots = JSON.parse(localStorage.getItem('v82_bots')) || [];
        function render() {
            const l = document.getElementById('bots_list'); l.innerHTML = '';
            bots.forEach((b,i) => {
                l.innerHTML += `
                <div class="bot-item ${b.status?'on':''}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px">
                        <b>${b.symbol}</b>
                        <div style="font-size:10px; cursor:pointer" onclick="del(${i})">🗑</div>
                    </div>
                    <div class="inp-row">
                        <input type="text" value="${b.symbol}" onchange="upd(${i},'symbol',this.value)">
                        <input type="number" value="${b.amount}" onchange="upd(${i},'amount',this.value)" placeholder="$">
                        <input type="number" value="${b.drop}" onchange="upd(${i},'drop',this.value)" placeholder="Drop%">
                    </div>
                    <div style="margin-top:8px; display:flex; gap:5px">
                        <button class="btn" style="padding:5px; background:${b.status?'#27ae60':'#333'}; font-size:10px" onclick="tog(${i})">${b.status?'RUNNING':'STOPPED'}</button>
                    </div>
                </div>`;
            });
        }

        function upd(i,k,v){ bots[i][k]=(k==='symbol')?v.toUpperCase():parseFloat(v); saveLoc(); }
        function tog(i){ bots[i].status = !bots[i].status; saveLoc(); render(); }
        function addBot(){ bots.push({id:'B'+Date.now(), symbol:'BTC/USDT', amount:10, drop:0.5, tp:0.5, status:false}); saveLoc(); render(); }
        function del(i){ if(confirm('Del?')){bots.splice(i,1); saveLoc(); render();} }
        function saveLoc(){ localStorage.setItem('v82_bots', JSON.stringify(bots)); }
        function save(){ saveLoc(); tg.HapticFeedback.notificationOccurred('success'); }
        function deploy(){ saveLoc(); tg.sendData(JSON.stringify({type:"SYNC", bots:bots})); }
        function tab(t){ 
            document.querySelectorAll('.content').forEach(e=>e.classList.remove('active'));
            document.getElementById('view-'+t).classList.add('active');
            document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
            event.target.classList.add('active');
        }

        if(bots.length===0) addBot();
        render();
    </script>
</body>
</html>
