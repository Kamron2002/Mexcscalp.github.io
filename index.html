<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expert V77</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --bg: #050505; --panel: #111; --primary: #7000ff; --accent: #00ff88; --text: #eee; --dim: #666; --border: 1px solid #222; }
        body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; margin: 0; padding: 10px; padding-bottom: 80px; font-size: 12px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(112, 0, 255, 0.05); border: 1px solid var(--primary); padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(112, 0, 255, 0.2); }
        .balance-label { color: var(--primary); font-size: 10px; text-transform: uppercase; }
        .balance-val { font-size: 24px; font-weight: bold; }

        .ai-badge { background: #222; padding: 5px 10px; border-radius: 4px; font-size: 10px; color: var(--accent); border: 1px solid var(--accent); margin-bottom: 15px; text-align: center; }

        .bot-card { background: var(--panel); border: var(--border); border-left: 3px solid var(--dim); padding: 15px; border-radius: 6px; margin-bottom: 15px; position: relative; transition: 0.3s; }
        .bot-card.active { border-left-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,136,0.05); }
        .bot-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .bot-title { font-weight: bold; font-size: 14px; color: #fff; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .inp-group { display: flex; flex-direction: column; }
        label { color: var(--dim); font-size: 9px; margin-bottom: 3px; }
        input { background: #000; border: 1px solid #333; color: white; padding: 8px; border-radius: 4px; outline: none; font-size: 12px; width: 100%; box-sizing: border-box; }
        input:focus { border-color: var(--primary); }

        .actions { display: flex; gap: 5px; margin-top: 10px; }
        .btn { border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; font-size: 10px; text-transform: uppercase; }
        .btn-start { background: rgba(0, 255, 136, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .btn-stop { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; }
        .btn-del { background: #222; color: #888; max-width: 30px; }

        .sync-btn { position: fixed; bottom: 20px; left: 20px; right: 80px; background: var(--primary); color: #fff; padding: 15px; border-radius: 30px; text-align: center; font-weight: bold; box-shadow: 0 0 20px rgba(112, 0, 255, 0.4); cursor: pointer; }
        .fab { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: #222; color: var(--primary); border: 1px solid var(--primary); border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; }
    </style>
</head>
<body>

    <div class="header">
        <div><div class="balance-label">USDT Balance</div><div class="balance-val">$ <span id="real_bal">Loading...</span></div></div>
        <div style="text-align: right; font-size: 9px; color: var(--dim);">EXPERT<br>SYSTEM V77</div>
    </div>

    <div class="ai-badge">🧠 AI ADAPTATION: ENABLED</div>

    <div id="bots_container"></div>

    <div class="sync-btn" onclick="syncToPython()">☁ UPDATE BRAIN</div>
    <div class="fab" onclick="addBot()">+</div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const injectedBal = urlParams.get('bal');
        if (injectedBal) { document.getElementById('real_bal').innerText = injectedBal; localStorage.setItem('cached_bal', injectedBal); } 
        else { document.getElementById('real_bal').innerText = localStorage.getItem('cached_bal') || '0.00'; }

        let bots = JSON.parse(localStorage.getItem('v77_bots')) || [];

        function render() {
            const container = document.getElementById('bots_container'); container.innerHTML = '';
            bots.forEach((bot, idx) => {
                const el = document.createElement('div');
                el.className = `bot-card ${bot.status ? 'active' : ''}`;
                el.innerHTML = `
                    <div class="bot-header"><span class="bot-title">#${idx+1} ${bot.symbol}</span><span style="color:${bot.status ? 'var(--accent)' : '#555'}">${bot.status ? '● ACTIVE' : '○ SLEEP'}</span></div>
                    <div class="grid">
                        <div class="inp-group"><label>PAIR</label><input type="text" value="${bot.symbol}" onchange="update(${idx}, 'symbol', this.value)"></div>
                        <div class="inp-group"><label>BASE $</label><input type="number" value="${bot.amount}" onchange="update(${idx}, 'amount', this.value)"></div>
                        <div class="inp-group"><label>DROP %</label><input type="number" value="${bot.drop}" onchange="update(${idx}, 'drop', this.value)"></div>
                    </div>
                    <div class="grid">
                        <div class="inp-group"><label>TP %</label><input type="number" value="${bot.tp}" onchange="update(${idx}, 'tp', this.value)"></div>
                        <div class="inp-group"><label>SL %</label><input type="number" value="${bot.sl}" onchange="update(${idx}, 'sl', this.value)"></div>
                        <div class="inp-group"><label>MAX $</label><input type="number" value="${bot.budget}" onchange="update(${idx}, 'budget', this.value)"></div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-start" onclick="setStatus(${idx}, true)">RUN</button>
                        <button class="btn btn-stop" onclick="setStatus(${idx}, false)">STOP</button>
                        <button class="btn btn-del" onclick="delBot(${idx})">×</button>
                    </div>`;
                container.appendChild(el);
            });
        }

        function addBot() { bots.push({id: 'BOT_'+Date.now(), symbol: 'BTC/USDT', amount: 10, drop: 0.35, tp: 0.5, sl: 0, budget: 50, status: false}); save(); render(); }
        function update(idx, field, val) { bots[idx][field] = (field==='symbol'||field==='id') ? val.toUpperCase() : parseFloat(val); save(); }
        function setStatus(idx, status) { bots[idx].status = status; save(); render(); syncToPython(); }
        function delBot(idx) { if(confirm('Delete?')) { bots.splice(idx, 1); save(); render(); } }
        function save() { localStorage.setItem('v77_bots', JSON.stringify(bots)); }
        function syncToPython() { if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); tg.sendData(JSON.stringify({type: "SYNC", bots: bots})); }
        
        if(bots.length === 0) addBot();
        render();
    </script>
</body>
</html>
