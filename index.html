<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scalper Pro V85</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg: #0F1215; --card: #181C20; --card-hover: #1F2429;
            --primary: #2962FF; --primary-hover: #1E4ECA;
            --green: #00C853; --red: #FF3D00; --yellow: #FFC107;
            --text: #FFFFFF; --text-dim: #8A94A6;
            --border: 1px solid #2A2F35;
        }

        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 15px; padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
        }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }
        
        .balance-box {
            background: linear-gradient(135deg, #181C20 0%, #0F1215 100%);
            border: var(--border); border-radius: 16px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .bal-label { color: var(--text-dim); font-size: 12px; font-weight: 500; margin-bottom: 4px; }
        .bal-value { font-size: 28px; font-weight: 700; }
        .btn-refresh { background: rgba(255,255,255,0.05); border: none; color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        /* BOTS LIST */
        .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-dim); }
        .bot-card {
            background: var(--card); border: var(--border); border-radius: 12px;
            padding: 16px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px;
        }
        .bot-top { display: flex; justify-content: space-between; align-items: center; }
        .bot-sym { font-size: 16px; font-weight: 700; }
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .status-on { background: rgba(0, 200, 83, 0.1); color: var(--green); }
        .status-off { background: rgba(138, 148, 166, 0.1); color: var(--text-dim); }
        
        .bot-stats-row { display: flex; justify-content: space-between; background: #0B0D0F; padding: 10px; border-radius: 8px; font-size: 11px; color: var(--text-dim); border: 1px solid #1A1D21; }
        .stat-item span { color: #fff; font-weight: 600; display: block; margin-top: 3px; }

        /* BOT CONTROLS */
        .bot-actions { display: flex; gap: 8px; }
        .btn-action { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .btn-toggle-on { background: var(--primary); color: #fff; }
        .btn-toggle-off { background: rgba(255,255,255,0.05); color: var(--text); }
        .btn-edit { background: rgba(255,255,255,0.05); color: var(--text); flex: 0 0 auto; padding: 10px 16px; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 100; display: none; justify-content: center; align-items: flex-end;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal-content {
            background: var(--bg); width: 100%; max-height: 90vh; overflow-y: auto;
            border-radius: 20px 20px 0 0; padding: 24px; box-sizing: border-box;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: var(--border);
        }
        .modal-overlay.open .modal-content { transform: translateY(0); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 700; }
        .close-btn { background: none; border: none; color: var(--text-dim); font-size: 24px; cursor: pointer; padding: 0; }

        /* FORM */
        .form-section { background: var(--card); padding: 16px; border-radius: 12px; border: var(--border); margin-bottom: 16px; }
        .form-section-title { font-size: 12px; font-weight: 600; color: var(--primary); text-transform: uppercase; margin-bottom: 12px; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;}
        .input-group label { font-size: 11px; color: var(--text-dim); font-weight: 500; }
        .input-group input, .input-group select { 
            background: #0F1215; border: 1px solid #2A2F35; color: #fff; 
            padding: 12px; border-radius: 8px; font-size: 14px; outline: none; font-family: 'Inter', sans-serif;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); }

        .danger-zone { border-color: rgba(255, 61, 0, 0.3); }
        .danger-title { color: var(--red); }
        
        .btn-be { background: rgba(255, 193, 7, 0.1); color: var(--yellow); border: 1px solid var(--yellow); width: 100%; margin-bottom: 8px; padding: 12px; border-radius: 8px; font-weight: 600;}
        .btn-panic { background: rgba(255, 61, 0, 0.1); color: var(--red); border: 1px solid var(--red); width: 100%; padding: 12px; border-radius: 8px; font-weight: 600;}

        .main-btn {
            position: fixed; bottom: 20px; left: 15px; right: 15px;
            background: var(--primary); color: #fff; border: none;
            padding: 16px; border-radius: 12px; font-weight: 600; font-size: 15px;
            box-shadow: 0 4px 15px rgba(41, 98, 255, 0.3); cursor: pointer; z-index: 50;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">SCALPER <span>V85</span></div>
    </div>

    <div class="balance-box">
        <div>
            <div class="bal-label">TOTAL USDT BALANCE</div>
            <div class="bal-value">$ <span id="main_bal">0.00</span></div>
        </div>
        <button class="btn-refresh" onclick="reqRefresh()">↻</button>
    </div>

    <div class="section-title">YOUR STRATEGIES</div>
    <div id="bots_list"></div>

    <div style="text-align: center; margin-top: 20px; margin-bottom: 40px;">
        <button class="btn-action" style="background: transparent; border: 1px dashed #2A2F35; color: var(--primary); width: 100%;" onclick="addBot()">+ ADD NEW BOT</button>
    </div>

    <button class="main-btn" onclick="deploy()">🚀 SAVE & SYNC TO CLOUD</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Edit Bot</div>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <input type="hidden" id="edit_idx">
            
            <div class="form-section">
                <div class="form-section-title">General</div>
                <div class="input-group">
                    <label>Trading Pair</label>
                    <input type="text" id="m_symbol" placeholder="BTC/USDT">
                </div>
                <div class="input-grid">
                    <div class="input-group"><label>Base Order ($)</label><input type="number" id="m_amount"></div>
                    <div class="input-group"><label>Max Budget ($)</label><input type="number" id="m_budget"></div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Price Range Limits</div>
                <div class="input-grid">
                    <div class="input-group"><label>Min Price ($)</label><input type="number" id="m_min_p" placeholder="0 = Off"></div>
                    <div class="input-group"><label>Max Price ($)</label><input type="number" id="m_max_p" placeholder="0 = Off"></div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Averaging Strategy (DCA)</div>
                <div class="input-group">
                    <label>Averaging Base (Расчет от)</label>
                    <select id="m_dca_mode">
                        <option value="AVERAGE">Average Price (Средняя цена)</option>
                        <option value="LAST_BUY">Last Buy Price (Последняя покупка)</option>
                        <option value="LAST_HIGH">Last High / Peak (Следящий пик)</option>
                    </select>
                </div>
                <div class="input-grid">
                    <div class="input-group"><label>Price Drop (%)</label><input type="number" id="m_drop" placeholder="0.5"></div>
                    <div class="input-group"><label>DCA Multiplier (x)</label><input type="number" id="m_dca" placeholder="1.5"></div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">Risk Management</div>
                <div class="input-grid">
                    <div class="input-group"><label>Take Profit (%)</label><input type="number" id="m_tp"></div>
                    <div class="input-group"><label>Stop Loss (%)</label><input type="number" id="m_sl" placeholder="0 = Off"></div>
                </div>
            </div>

            <div class="form-section danger-zone">
                <div class="form-section-title danger-title">Emergency Actions</div>
                <button class="btn-be" onclick="sendEmergency('BREAK_EVEN')">⚖️ PLACE BREAK-EVEN ORDER</button>
                <button class="btn-panic" onclick="sendEmergency('PANIC_SELL')">🚨 PANIC SELL TO MARKET</button>
                <div style="font-size: 10px; color: var(--text-dim); text-align: center; margin-top: 5px;">These actions execute immediately and close this window.</div>
            </div>

            <button class="btn-action btn-toggle-on" style="width: 100%; margin-top: 10px;" onclick="saveModal()">APPLY SETTINGS</button>
            <div style="height: 50px;"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        
        const urlP = new URLSearchParams(window.location.search);
        const bal = urlP.get('b'); 
        if(bal) document.getElementById('main_bal').innerText = bal;

        const defaultBot = () => ({
            id: 'B'+Date.now(), symbol: 'BTC/USDT', 
            amount: 10, dca_mult: 1.5, drop: 0.5, tp: 0.5, sl: 0, budget: 100, 
            min_price: 0, max_price: 0, dca_mode: "AVERAGE", status: false
        });

        let bots = JSON.parse(localStorage.getItem('scalper_v85')) || [];
        if(bots.length === 0) bots.push(defaultBot());

        function render() {
            const list = document.getElementById('bots_list');
            list.innerHTML = '';
            bots.forEach((b, i) => {
                list.innerHTML += `
                <div class="bot-card">
                    <div class="bot-top">
                        <div class="bot-sym">${b.symbol}</div>
                        <div class="status-badge ${b.status?'status-on':'status-off'}">${b.status?'ACTIVE':'PAUSED'}</div>
                    </div>
                    
                    <div class="bot-stats-row">
                        <div class="stat-item">Mode: <span>${b.dca_mode === 'LAST_HIGH' ? 'Trailing' : b.dca_mode}</span></div>
                        <div class="stat-item">Range: <span>${b.min_price>0?b.min_price:0} - ${b.max_price>0?b.max_price:'∞'}</span></div>
                        <div class="stat-item">Max: <span>$${b.budget}</span></div>
                    </div>

                    <div class="bot-actions" style="margin-top: 5px;">
                        <button class="btn-action ${b.status?'btn-toggle-on':'btn-toggle-off'}" onclick="toggleStatus(${i})">
                            ${b.status ? '⏹ STOP' : '▶ START'}
                        </button>
                        <button class="btn-edit" onclick="openModal(${i})">⚙️ SETTINGS</button>
                    </div>
                </div>`;
            });
        }

        function toggleStatus(i) { bots[i].status = !bots[i].status; saveLocal(); render(); }
        function addBot() { bots.push(defaultBot()); saveLocal(); render(); openModal(bots.length - 1); }

        function openModal(i) {
            const b = bots[i]; document.getElementById('edit_idx').value = i;
            document.getElementById('modalTitle').innerText = `Configure ${b.symbol}`;
            document.getElementById('m_symbol').value = b.symbol;
            document.getElementById('m_amount').value = b.amount;
            document.getElementById('m_budget').value = b.budget;
            document.getElementById('m_drop').value = b.drop;
            document.getElementById('m_dca').value = b.dca_mult;
            document.getElementById('m_tp').value = b.tp;
            document.getElementById('m_sl').value = b.sl;
            document.getElementById('m_min_p').value = b.min_price || 0;
            document.getElementById('m_max_p').value = b.max_price || 0;
            document.getElementById('m_dca_mode').value = b.dca_mode || "AVERAGE";

            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

        function saveModal() {
            const i = document.getElementById('edit_idx').value;
            bots[i].symbol = document.getElementById('m_symbol').value.toUpperCase();
            bots[i].amount = parseFloat(document.getElementById('m_amount').value) || 10;
            bots[i].budget = parseFloat(document.getElementById('m_budget').value) || 0;
            bots[i].drop = parseFloat(document.getElementById('m_drop').value) || 0.5;
            bots[i].dca_mult = parseFloat(document.getElementById('m_dca').value) || 1.5;
            bots[i].tp = parseFloat(document.getElementById('m_tp').value) || 0.5;
            bots[i].sl = parseFloat(document.getElementById('m_sl').value) || 0;
            bots[i].min_price = parseFloat(document.getElementById('m_min_p').value) || 0;
            bots[i].max_price = parseFloat(document.getElementById('m_max_p').value) || 0;
            bots[i].dca_mode = document.getElementById('m_dca_mode').value;

            saveLocal(); render(); closeModal();
        }

        function saveLocal() { localStorage.setItem('scalper_v85', JSON.stringify(bots)); }
        
        function deploy() {
            saveLocal();
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(JSON.stringify({type: "SYNC", bots: bots}));
        }

        // EMERGENCY COMMANDS (From Modal directly to Python)
        function sendEmergency(actionType) {
            const i = document.getElementById('edit_idx').value;
            const botId = bots[i].id;
            
            let msg = actionType === 'PANIC_SELL' 
                ? "SELL ALL TO MARKET NOW?" 
                : "Cancel active orders and place a LIMIT SELL at your average entry price?";
            
            if(confirm(msg)) {
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
                tg.sendData(JSON.stringify({type: actionType, bot_id: botId}));
                closeModal(); // Close modal after action
            }
        }

        function reqRefresh() { tg.sendData(JSON.stringify({type: "REFRESH"})); }

        render();
    </script>
</body>
</html>
