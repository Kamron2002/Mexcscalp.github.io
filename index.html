<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Final Architect V92</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
        :root { --bg: #07090C; --card: #111419; --accent: #00E676; --red: #FF1744; --yellow: #FFD600; --text: #FFFFFF; --sub: #6C7A8C; --border: 1px solid #1E232B; }
        body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; margin: 0; padding: 15px; padding-bottom: 50px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
        .logo span { color: var(--accent); }
        
        .bal-card { background: linear-gradient(145deg, #161A21 0%, #0D1014 100%); border: var(--border); border-radius: 16px; padding: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,230,118,0.05); border-left: 4px solid var(--accent); }
        .bal-val { font-size: 32px; font-weight: 700; margin-top: 5px; }
        .btn-refresh { background: rgba(255,255,255,0.05); border: none; color: var(--text); padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 16px; }

        .bot-card { background: var(--card); border: var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; transition: 0.3s; }
        .bot-card.on { border-color: rgba(0,230,118,0.4); box-shadow: 0 0 20px rgba(0,230,118,0.05); }
        .bot-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .bot-sym { font-size: 18px; font-weight: 700; }
        
        .badge { padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .on .badge { background: rgba(0,230,118,0.1); color: var(--accent); }
        .bot-card:not(.on) .badge { background: rgba(108,122,140,0.1); color: var(--sub); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; background: #0A0C10; padding: 12px; border-radius: 12px; border: var(--border); }
        .stat-item { font-size: 11px; color: var(--sub); display: flex; flex-direction: column; gap: 4px; text-transform: uppercase;}
        .stat-item span { color: #fff; font-size: 13px; font-weight: 600; }
        .trail-active { color: var(--accent) !important; text-shadow: 0 0 5px var(--accent); }

        .actions { display: flex; gap: 10px; margin-bottom: 10px;}
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-run { background: var(--accent); color: #000; }
        .btn-stop { background: #1E232B; color: var(--text); }
        .btn-edit { background: rgba(255,255,255,0.05); color: var(--text); flex: 0 0 50px; }
        
        .btn-be { background: rgba(255,214,0,0.1); color: var(--yellow); border: 1px solid rgba(255,214,0,0.3); }
        .btn-panic { background: rgba(255,23,68,0.1); color: var(--red); border: 1px solid rgba(255,23,68,0.3); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; display: none; align-items: flex-end; }
        .modal.open { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-height: 85vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 25px; border-top: 1px solid #2A2F35; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 25px; display: flex; justify-content: space-between; }
        
        .section { background: #0A0C10; padding: 18px; border-radius: 14px; border: var(--border); margin-bottom: 15px; }
        .sec-title { font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .inp-grp { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .inp-grp label { font-size: 12px; color: var(--sub); font-weight: 600; }
        .inp-grp input, .inp-grp select { background: #161A21; border: 1px solid #2A2F35; color: #fff; padding: 14px; border-radius: 10px; font-size: 15px; outline: none; }
        .inp-grp input:focus, .inp-grp select:focus { border-color: var(--accent); }
    </style>
</head>
<body>

    <div class="header"><div class="logo">FINAL <span>ARCHITECT</span></div></div>
    
    <div class="bal-card">
        <div>
            <div style="color:var(--sub);font-size:12px;font-weight:600;letter-spacing:1px">USDT BALANCE</div>
            <div class="bal-val">$ <span id="main_bal">0.00</span></div>
        </div>
        <button class="btn-refresh" onclick="tg.sendData(JSON.stringify({type:'REFRESH'}))">↻</button>
    </div>

    <div id="bots_list"></div>
    <div style="text-align:center; margin-top:20px; margin-bottom:40px;"><button class="btn" style="background:transparent; border:2px dashed #2A2F35; color:var(--sub); width:100%; padding:15px; font-size:14px;" onclick="addBot()">+ ADD NEW BOT</button></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title"><span id="m_title">Bot Setup</span><span style="color:var(--sub);cursor:pointer" onclick="document.getElementById('modal').classList.remove('open')">✕</span></div>
            <input type="hidden" id="e_idx">
            
            <div class="section">
                <div class="sec-title">Core Setup</div>
                <div class="inp-grp"><label>Symbol Pair</label><input type="text" id="m_sym"></div>
                <div class="grid">
                    <div class="inp-grp"><label>Base Order ($)</label><input type="number" id="m_amt"></div>
                    <div class="inp-grp"><label>Max Budget ($)</label><input type="number" id="m_bud"></div>
                </div>
            </div>

            <div class="section">
                <div class="sec-title">Trading Range</div>
                <div class="grid">
                    <div class="inp-grp"><label>Min Price</label><input type="number" id="m_min"></div>
                    <div class="inp-grp"><label>Max Price</label><input type="number" id="m_max"></div>
                </div>
            </div>

            <div class="section" style="border-color: rgba(0,230,118,0.3);">
                <div class="sec-title" style="color:var(--accent)">Smart DCA Logic</div>
                <div class="inp-grp">
                    <label>Averaging Base</label>
                    <select id="m_mode">
                        <option value="LAST_DEAL">LAST DEAL (Average Price)</option>
                        <option value="LAST_BUY">LAST BUY (Previous Step)</option>
                        <option value="LAST_HIGH">LAST HIGH (Trailing Peak)</option>
                    </select>
                </div>
                <div class="grid">
                    <div class="inp-grp"><label>Price Drop (%)</label><input type="number" id="m_drop"></div>
                    <div class="inp-grp"><label>Multiplier (x)</label><input type="number" id="m_dca"></div>
                </div>
            </div>

            <div class="section">
                <div class="sec-title">Smart Targets</div>
                <div class="grid">
                    <div class="inp-grp"><label>Take Profit Base (%)</label><input type="number" id="m_tp"></div>
                    <div class="inp-grp"><label>Trailing Dev. (%)</label><input type="number" id="m_trail" placeholder="0 = Limit TP"></div>
                </div>
                <div class="inp-grp"><label>Stop Loss (%)</label><input type="number" id="m_sl" placeholder="0 = Off"></div>
            </div>

            <button class="btn btn-run" style="width:100%; padding:16px; font-size:15px; margin-top:10px" onclick="saveModal()">APPLY & SYNC</button>
            <div style="height:50px"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const b = new URLSearchParams(window.location.search).get('b');
        if(b) document.getElementById('main_bal').innerText = b;

        let bots = JSON.parse(localStorage.getItem('v92')) || [{
            id:'B'+Date.now(), symbol:'BTC/USDT', amount:10, dca_mult:1.5, drop:0.5, tp:0.5, sl:0, budget:100, min_price:0, max_price:0, dca_mode:"LAST_DEAL", trailing_dev:0, status:false
        }];

        function rndr() {
            const l = document.getElementById('bots_list'); l.innerHTML = '';
            bots.forEach((b, i) => {
                let trailStr = b.trailing_dev > 0 ? `<span class="trail-active">${b.trailing_dev}% T-TP</span>` : `<span>Limit TP</span>`;
                let dcaStr = b.dca_mode === 'LAST_HIGH' ? `<span class="trail-active">TRAILING</span>` : `<span>${b.dca_mode.replace('LAST_','')}</span>`;
                
                l.innerHTML += `
                <div class="bot-card ${b.status?'on':''}">
                    <div class="bot-top">
                        <div class="bot-sym">${b.symbol}</div><div class="badge">${b.status?'ACTIVE':'STANDBY'}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item">DCA MODE ${dcaStr}</div>
                        <div class="stat-item">DROP <span>${b.drop}%</span></div>
                        <div class="stat-item">EXIT ${trailStr}</div>
                    </div>
                    
                    <div class="actions">
                        <button class="btn ${b.status?'btn-stop':'btn-run'}" onclick="tog(${i})">${b.status?'PAUSE (SYNC)':'START (SYNC)'}</button>
                        <button class="btn-edit" onclick="opn(${i})">⚙️</button>
                    </div>
                    
                    <div class="actions" style="margin-top: 10px;">
                        <button class="btn btn-be" onclick="sendAction('BREAK_EVEN', ${i})">⚖️ BREAK-EVEN</button>
                        <button class="btn btn-panic" onclick="sendAction('PANIC_SELL', ${i})">🚨 PANIC SELL</button>
                    </div>
                </div>`;
            });
        }

        function tog(i){ 
            bots[i].status = !bots[i].status; 
            sv(); deploy(); // Мгновенная синхронизация при старте/паузе
        }
        
        function addBot(){ 
            bots.push({ id:'B'+Date.now(), symbol:'ETH/USDT', amount:10, dca_mult:1.5, drop:0.5, tp:0.5, sl:0, budget:100, min_price:0, max_price:0, dca_mode:"LAST_DEAL", trailing_dev:0, status:false }); 
            sv(); rndr(); opn(bots.length-1); 
        }
        
        function opn(i) {
            const b = bots[i]; document.getElementById('e_idx').value = i; document.getElementById('m_title').innerText = b.symbol;
            document.getElementById('m_sym').value = b.symbol; document.getElementById('m_amt').value = b.amount;
            document.getElementById('m_bud').value = b.budget; document.getElementById('m_min').value = b.min_price || 0;
            document.getElementById('m_max').value = b.max_price || 0; document.getElementById('m_drop').value = b.drop; 
            document.getElementById('m_mode').value = b.dca_mode || "LAST_DEAL"; document.getElementById('m_dca').value = b.dca_mult; 
            document.getElementById('m_tp').value = b.tp; document.getElementById('m_sl').value = b.sl || 0;
            document.getElementById('m_trail').value = b.trailing_dev || 0;
            document.getElementById('modal').classList.add('open');
        }
        
        function saveModal() {
            const i = document.getElementById('e_idx').value;
            bots[i].symbol = document.getElementById('m_sym').value.toUpperCase();
            bots[i].amount = parseFloat(document.getElementById('m_amt').value) || 10;
            bots[i].budget = parseFloat(document.getElementById('m_bud').value) || 0;
            bots[i].min_price = parseFloat(document.getElementById('m_min').value) || 0;
            bots[i].max_price = parseFloat(document.getElementById('m_max').value) || 0;
            bots[i].dca_mode = document.getElementById('m_mode').value;
            bots[i].drop = parseFloat(document.getElementById('m_drop').value) || 0.5;
            bots[i].dca_mult = parseFloat(document.getElementById('m_dca').value) || 1.5;
            bots[i].tp = parseFloat(document.getElementById('m_tp').value) || 0.5;
            bots[i].sl = parseFloat(document.getElementById('m_sl').value) || 0;
            bots[i].trailing_dev = parseFloat(document.getElementById('m_trail').value) || 0;
            
            sv(); deploy(); // Мгновенная синхронизация при сохранении настроек
        }

        function sv(){ localStorage.setItem('v92', JSON.stringify(bots)); }
        
        function deploy(){ 
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); 
            tg.sendData(JSON.stringify({type: "SYNC", bots: bots})); 
        }
        
        function sendAction(type, idx) {
            let msg = type === 'PANIC_SELL' ? 'SELL ALL TO MARKET NOW?' : 'Cancel active orders and place a LIMIT SELL at your average entry price?';
            if(confirm(msg)){
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
                tg.sendData(JSON.stringify({type: type, bot_id: bots[idx].id}));
            }
        }
        
        rndr();
    </script>
</body>
</html>
